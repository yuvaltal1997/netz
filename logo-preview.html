<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נץ – לוגו</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Assistant',sans-serif;background:#e8edf3;color:#0e1626}
.hero{background:radial-gradient(ellipse at 50% 35%,#11284a 0%,#0a172a 45%,#050912 100%);color:#fff;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:18px}
.lock{display:flex;align-items:center;gap:22px}
.lock b{font-family:'Secular One',sans-serif;font-weight:400;font-size:120px;line-height:.9}
.tag{font-weight:800;font-size:30px}
.tag span{color:#50c4f0}
.row{display:flex;flex-wrap:wrap;gap:40px;padding:32px 24px;align-items:flex-end}
.dark{background:#0a0e17}
.glow{filter:drop-shadow(0 0 18px rgba(80,196,240,.35))}
</style>
</head>
<body>
<div class="hero">
  <div class="lock"><img class="glow" src="logo.svg" width="150" alt=""><b>נץ</b></div>
  <div class="tag">מקבלים החלטות <span>חכמות.</span> מצילים <span>זמן</span></div>
</div>
<div class="row dark">
  <img class="glow" src="logo.svg" width="96" alt=""><img src="logo.svg" width="48" alt=""><img src="logo.svg" width="32" alt="">
  <img src="logo-icon.svg" width="96" alt=""><img src="logo-icon.svg" width="48" alt=""><img src="logo-icon.svg" width="32" alt=""><img src="logo-icon.svg" width="16" alt="">
</div>
<div class="row">
  <img src="logo-icon.svg" width="96" alt=""><img src="logo-icon.svg" width="48" alt=""><img src="logo-icon.svg" width="32" alt=""><img src="logo-icon.svg" width="16" alt="">
</div>
</body>
</html>
